<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contacto - Mi Portafolio</title>
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">MiPortafolio</a>
      <button class="nav-toggle" aria-controls="primary-nav" aria-expanded="false">
        <span class="hamburger"></span>
      </button>
      <nav id="primary-nav" class="primary-nav" aria-label="Navegación principal">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="about.html">Sobre mí</a></li>
          <li><a href="gallery.html">Galería</a></li>
          <li><a href="contact.html">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container contact-page">
    <section>
      <h1>Contacto</h1>
      <p>Llena el formulario y te responderé lo antes posible.</p>

      <form id="contactForm" novalidate>
        <div class="form-group">
          <label for="name">Nombre</label>
          <input type="text" id="name" name="name" required>
          <small class="error" id="error-name" aria-live="polite"></small>
        </div>

        <div class="form-group">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" required>
          <small class="error" id="error-email" aria-live="polite"></small>
        </div>

        <div class="form-group">
          <label for="message">Mensaje</label>
          <textarea id="message" name="message" rows="6" required></textarea>
          <small class="error" id="error-message" aria-live="polite"></small>
        </div>

        <button class="btn" type="submit">Enviar mensaje</button>

        <div id="formFeedback" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year-4"></span> MiPortafolio</p>
    </div>
  </footer>

  <script src="js/app.js" defer></script>
</body>
</html>
